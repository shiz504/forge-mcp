name: forge-mcp

services:
  forge-mcp:
    build: .
    container_name: forge-mcp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8093:8093"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8093/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
